name: Build NTPWEdit Enterprise

on:
  push:
    branches: [ enterprise-cli ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: source and script validation
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File -Filter *.ps1 | Where-Object {
            $_.FullName -notmatch '[\\/]\.git[\\/]'
          }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count) {
              $errors | Format-List
              throw "PowerShell syntax error: $($file.FullName)"
            }
          }

      - name: Validate Enterprise source contract
        shell: pwsh
        run: |
          $cmake = Get-Content src\CMakeLists.txt -Raw
          $cli = Get-Content src\cli.c -Raw
          $header = Get-Content src\libntpw\ntpw.h -Raw
          $library = Get-Content src\libntpw\ntpw.c -Raw
          $main = Get-Content src\main.c -Raw
          $guiargs = Get-Content src\guiargs.c -Raw
          $unicode = Get-Content src\libdlg\unicode.h -Raw
          $dlgabout = Get-Content src\dlgabout.c -Raw
          $message = Get-Content src\message.c -Raw
          $version = Get-Content src\version.c -Raw

          foreach ($token in @(
            'add_executable(ntpwcli',
            'ntpweditarm64',
            'int main(int argc, char **argv)',
            '/discover',
            '/password-prompt',
            '/unlock-enable',
            'get_account_status',
            'clear_account_lockout',
            'set_account_enabled',
            '#include <commdlg.h>',
            '#include <shellapi.h>',
            '#include <stdlib.h>',
            'LVM_GETITEMW',
            'NTPWEdit Enterprise 1.0.0'
          )) {
            if (($cmake + $cli + $header + $library + $main + $guiargs + $unicode + $dlgabout + $message + $version + (Get-Content src\ntpwcli.c -Raw)) -notlike "*$token*") {
              throw "Missing Enterprise source token: $token"
            }
          }

          if ($main -match 'cli_should_run|app_main\s*\(') {
            throw 'The GUI source still contains the legacy hybrid CLI entry point.'
          }
          if ($main -notmatch 'int\s+main\s*\(\s*void\s*\)') {
            throw 'The original GUI main(void) entry point is missing.'
          }

          if ($cmake -match 'WIN32_LEAN_AND_MEAN') {
            throw 'WIN32_LEAN_AND_MEAN is incompatible with the legacy GUI source and must not be defined.'
          }
          if ($guiargs -match 'ListView_GetItemW\s*\(|ListView_GetItemTextW\s*\(') {
            throw 'guiargs.c contains unsupported ListView_*W helper calls.'
          }

  build:
    name: build (${{ matrix.name }})
    needs: validate
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            cmake_arch: x64
            gui: ntpwedit64.exe
            artifact: NTPWEdit-Enterprise-amd64
            machine: '0x8664'
            smoke: true
          - name: x86
            cmake_arch: Win32
            gui: ntpwedit.exe
            artifact: NTPWEdit-Enterprise-x86
            machine: '0x014C'
            smoke: true
          - name: arm64
            cmake_arch: ARM64
            gui: ntpweditarm64.exe
            artifact: NTPWEdit-Enterprise-arm64
            machine: '0xAA64'
            smoke: false

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Configure
        shell: pwsh
        run: |
          cmake -S src -B "build-${{ matrix.name }}" `
            -A "${{ matrix.cmake_arch }}" `
            -DNTPWEDIT_BUILD_GUI=ON `
            -DNTPWEDIT_BUILD_CLI=ON `
            -DNTPWEDIT_ENABLE_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build "build-${{ matrix.name }}" --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate and validate executables
        id: binaries
        shell: pwsh
        run: |
          function Get-PeMachine([string]$Path) {
            $stream = [IO.File]::OpenRead($Path)
            try {
              $reader = New-Object IO.BinaryReader($stream)
              $stream.Position = 0x3c
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "Invalid PE signature: $Path" }
              return ('0x{0:X4}' -f $reader.ReadUInt16())
            }
            finally { $stream.Dispose() }
          }

          $gui = Get-ChildItem "build-${{ matrix.name }}" -Recurse -File -Filter "${{ matrix.gui }}" | Select-Object -First 1
          $cli = Get-ChildItem "build-${{ matrix.name }}" -Recurse -File -Filter ntpwcli.exe | Select-Object -First 1
          if (-not $gui) { throw "GUI executable was not produced: ${{ matrix.gui }}" }
          if (-not $cli) { throw 'Console executable was not produced: ntpwcli.exe' }

          $expected = '${{ matrix.machine }}'
          foreach ($file in @($gui, $cli)) {
            $actual = Get-PeMachine $file.FullName
            Write-Host "$($file.Name): $actual"
            if ($actual -ne $expected) {
              throw "$($file.Name) has PE machine $actual, expected $expected"
            }
          }

          "gui=$($gui.FullName)" >> $env:GITHUB_OUTPUT
          "cli=$($cli.FullName)" >> $env:GITHUB_OUTPUT

      - name: Native CLI smoke tests
        if: matrix.smoke
        shell: pwsh
        run: |
          $cli = '${{ steps.binaries.outputs.cli }}'
          $versionOutput = @(& $cli /version 2>&1)
          $versionExitCode = $LASTEXITCODE
          $versionOutput | ForEach-Object { Write-Host ([string]$_) }
          if ($versionExitCode -ne 0) { throw "ntpwcli /version failed: $versionExitCode" }

          $helpOutput = @(& $cli /? 2>&1)
          $helpExitCode = $LASTEXITCODE
          if ($helpExitCode -ne 0) { throw "ntpwcli /? failed: $helpExitCode" }
          if (($helpOutput -join "`n") -notmatch 'NTPWEdit Enterprise CLI') {
            throw 'ntpwcli /? returned unexpected output.'
          }

          $jsonPath = Join-Path $env:RUNNER_TEMP 'ntpw-discovery.json'
          $discoveryOutput = @(& $cli /discover /format json /output $jsonPath 2>&1)
          $discoveryExitCode = $LASTEXITCODE
          $discoveryOutput | ForEach-Object { Write-Host ([string]$_) }
          if ($discoveryExitCode -ne 0) { throw "ntpwcli /discover failed: $discoveryExitCode" }
          $document = Get-Content -LiteralPath $jsonPath -Raw | ConvertFrom-Json
          if ($document.tool -ne 'ntpwcli') { throw 'Unexpected discovery JSON tool field.' }
          if ($document.schemaVersion -ne 1) { throw 'Unexpected discovery JSON schema.' }
          if ($null -eq $document.installations) { throw 'Discovery JSON has no installations array.' }

          # Do not open the runner's live C:\Windows\System32\Config\SAM.
          # A GitHub-hosted runner does not provide an offline SAM test fixture, and
          # attempting /auto /list against the live operating system correctly fails.
          Write-Host 'Safe CLI smoke tests completed without accessing a SAM hive.'

      - name: Package architecture artifact
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'artifact'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item '${{ steps.binaries.outputs.gui }}' (Join-Path $out '${{ matrix.gui }}') -Force
          Copy-Item '${{ steps.binaries.outputs.cli }}' (Join-Path $out 'ntpwcli.exe') -Force
          Copy-Item README.md $out -ErrorAction SilentlyContinue
          Copy-Item README_ENTERPRISE_RU.txt $out -ErrorAction SilentlyContinue
          Copy-Item LICENSE $out -ErrorAction SilentlyContinue
          Copy-Item LICENSE.txt $out -ErrorAction SilentlyContinue
          Copy-Item LICENSE-ENTERPRISE-NOTICE.txt $out -ErrorAction SilentlyContinue

          @(
            Get-FileHash (Join-Path $out '${{ matrix.gui }}') -Algorithm SHA256
            Get-FileHash (Join-Path $out 'ntpwcli.exe') -Algorithm SHA256
          ) | ForEach-Object {
            '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf)
          } | Set-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii

          @(
            'NTPWEdit Enterprise 1.0.0',
            'Architecture : ${{ matrix.name }}',
            'GUI          : ${{ matrix.gui }}',
            'CLI          : ntpwcli.exe',
            'Commit       : ${{ github.sha }}',
            'Run          : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          ) | Set-Content (Join-Path $out 'BUILD-INFO.txt') -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact
          if-no-files-found: error
          retention-days: 90

  combined-package:
    name: combined release package
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: NTPWEdit-Enterprise-*
          path: downloaded

      - name: Create combined package
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'NTPWEdit-Enterprise-1.0.0'
          foreach ($arch in @('amd64','x86','arm64')) {
            New-Item -ItemType Directory -Path (Join-Path $package $arch) -Force | Out-Null
          }

          Copy-Item 'downloaded\NTPWEdit-Enterprise-amd64\*' (Join-Path $package 'amd64') -Recurse -Force
          Copy-Item 'downloaded\NTPWEdit-Enterprise-x86\*' (Join-Path $package 'x86') -Recurse -Force
          Copy-Item 'downloaded\NTPWEdit-Enterprise-arm64\*' (Join-Path $package 'arm64') -Recurse -Force

          Copy-Item (Join-Path $package 'amd64\ntpwedit64.exe') $package -Force
          Copy-Item (Join-Path $package 'x86\ntpwedit.exe') $package -Force
          Copy-Item (Join-Path $package 'arm64\ntpweditarm64.exe') $package -Force

          # x64 is the default root ntpwcli.exe; architecture-specific aliases are also provided.
          Copy-Item (Join-Path $package 'amd64\ntpwcli.exe') (Join-Path $package 'ntpwcli.exe') -Force
          Copy-Item (Join-Path $package 'amd64\ntpwcli.exe') (Join-Path $package 'ntpwcli64.exe') -Force
          Copy-Item (Join-Path $package 'x86\ntpwcli.exe') (Join-Path $package 'ntpwcli32.exe') -Force
          Copy-Item (Join-Path $package 'arm64\ntpwcli.exe') (Join-Path $package 'ntpwcliarm64.exe') -Force

          Get-ChildItem $package -Recurse -File -Filter *.exe | Sort-Object FullName | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            $relative = $_.FullName.Substring($package.Length + 1)
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), $relative
          } | Set-Content (Join-Path $package 'SHA256SUMS.txt') -Encoding ascii

          Compress-Archive -Path "$package\*" -DestinationPath 'NTPWEdit-Enterprise-1.0.0-Binaries.zip' -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: NTPWEdit-Enterprise-1.0.0-All
          path: |
            NTPWEdit-Enterprise-1.0.0
            NTPWEdit-Enterprise-1.0.0-Binaries.zip
          if-no-files-found: error
          retention-days: 90
